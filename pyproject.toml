[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fs-jax"
version = "0.1.0.dev0"
description = "Rotation-Sign-Permutation (RSP) alignment of posterior loadings in Bayesian factor models using JAX"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Xiongwen Ke" }]
maintainers = [{ name = "Xiongwen Ke" }]
dependencies = [
    "jax>=0.11.2",
    "jaxlib>=0.11.2",
    "optax>=0.2.8",
    "scipy>=1.18.1",
    "numpy>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
